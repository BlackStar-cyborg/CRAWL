# nginx for the CRAWL playground.
# The same traffic is written in three log formats at once, so you can compare what each one
# keeps and loses (exercise 1): common, combined, and a detailed JSON format.

load_module modules/ngx_http_js_module.so;   # njs: used only to log all request headers in arrival order

user nginx;
worker_processes 1;
error_log /var/log/crawl/error.log warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Banner variable: "off" sends "Server: nginx", "on" sends "Server: nginx/1.27.x" (exercise 4)
    server_tokens off;

    js_path   /etc/nginx/njs/;
    js_import headers from headers.js;
    js_set    $raw_headers headers.raw;

    log_format common_fmt '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';

    log_format crawl_json escape=json
        '{'
          '"ts":"$time_iso8601","msec":"$msec","request_id":"$request_id",'
          '"client_ip":"$remote_addr","client_port":"$remote_port",'
          '"server_ip":"$server_addr","server_port":"$server_port",'
          '"host":"$host","http_host":"$http_host",'
          '"method":"$request_method","uri":"$request_uri","protocol":"$server_protocol","raw_request":"$request",'
          '"status":"$status","bytes_sent":"$body_bytes_sent","request_length":"$request_length",'
          '"request_time":"$request_time","connection":"$connection","connection_requests":"$connection_requests",'
          '"user_agent":"$http_user_agent","referer":"$http_referer","accept":"$http_accept",'
          '"accept_language":"$http_accept_language","accept_encoding":"$http_accept_encoding",'
          '"x_forwarded_for":"$http_x_forwarded_for",'
          '"headers":"$raw_headers"'
        '}';

    access_log /var/log/crawl/access.common.log   common_fmt;
    access_log /var/log/crawl/access.combined.log combined;
    access_log /var/log/crawl/access.json         crawl_json;

    server {
        listen 80 default_server;
        server_name _;
        root /srv/site;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Token URLs: any /docs/<slug>-<token>.html answers with a believable landing page,
        # so a resolver has a reason to keep browsing ("session after token access").
        location /docs/ {
            try_files $uri /decoy.html;
        }
    }
}
