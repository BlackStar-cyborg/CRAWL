# Minimal Apache httpd for the CRAWL playground (only started with: docker compose --profile banner up -d)
# Same site as nginx; used to compare banners, default error pages and log formats (exercise 4).

ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module    modules/mod_mpm_event.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule mime_module         modules/mod_mime.so
LoadModule log_config_module   modules/mod_log_config.so
LoadModule unixd_module        modules/mod_unixd.so
LoadModule dir_module          modules/mod_dir.so
LoadModule headers_module      modules/mod_headers.so

User www-data
Group www-data
ServerName apache.crawl-lab.test

# Banner variable: try Prod | Major | Minor | Min | OS | Full, and ServerSignature On|Off
ServerTokens Full
ServerSignature On

DocumentRoot "/srv/site"
<Directory "/srv/site">
    Require all granted
</Directory>
DirectoryIndex index.html
TypesConfig conf/mime.types

ErrorLog /var/log/crawl/error.log
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %b" common
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
# detailed: ISO time with ms, client port, Host header, response time (microseconds), more headers
LogFormat "%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}t%{%z}t %a:%{remote}p \"%{Host}i\" \"%r\" %>s %B %D \"%{User-Agent}i\" \"%{Referer}i\" \"%{Accept}i\" \"%{Accept-Language}i\" \"%{X-Api-Version}i\"" detailed

CustomLog /var/log/crawl/access.common.log common
CustomLog /var/log/crawl/access.combined.log combined
CustomLog /var/log/crawl/access.detailed.log detailed
